spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: chat-room-backend

  datasource:
    url: ${CHAT_ROOM_DB_URL:jdbc:mysql://localhost:3306/chat_room?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${CHAT_ROOM_DB_USERNAME}
    password: ${CHAT_ROOM_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${CHAT_ROOM_REDIS_HOST}
      port: ${CHAT_ROOM_REDIS_PORT}
      password: ${CHAT_ROOM_REDIS_PASSWORD}

  rabbitmq:
    host: ${CHAT_ROOM_RABBITMQ_HOST}
    port: ${CHAT_ROOM_RABBITMQ_PORT}
    username: ${CHAT_ROOM_RABBITMQ_USERNAME}
    password: ${CHAT_ROOM_RABBITMQ_PASSWORD}
    virtual-host: ${CHAT_ROOM_RABBITMQ_VIRTUAL_HOST}
    publisher-confirm-type: correlated
    publisher-returns: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${CHAT_ROOM_JWT_SECRET:dev-secret-do-not-use-in-production}
    expiration-ms: 86400000
