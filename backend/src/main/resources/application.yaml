spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: do-together-backend

  datasource:
    url: ${DO_TOGETHER_DB_URL:jdbc:mysql://localhost:3306/do_together?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DO_TOGETHER_DB_USERNAME}
    password: ${DO_TOGETHER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${DO_TOGETHER_REDIS_HOST}
      port: ${DO_TOGETHER_REDIS_PORT}
      password: ${DO_TOGETHER_REDIS_PASSWORD}

  rabbitmq:
    host: ${DO_TOGETHER_RABBITMQ_HOST}
    port: ${DO_TOGETHER_RABBITMQ_PORT}
    username: ${DO_TOGETHER_RABBITMQ_USERNAME}
    password: ${DO_TOGETHER_RABBITMQ_PASSWORD}
    virtual-host: ${DO_TOGETHER_RABBITMQ_VIRTUAL_HOST}
    publisher-confirm-type: correlated
    publisher-returns: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${DO_TOGETHER_JWT_SECRET:dev-secret-do-not-use-in-production}
    expiration-ms: 86400000
