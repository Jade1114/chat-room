services:
  mysql:
    image: mysql:8.4
    container_name: do-together-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"
    environment:
      MYSQL_DATABASE: do_together
      MYSQL_ROOT_PASSWORD: ${DO_TOGETHER_DB_ROOT_PASSWORD}
      MYSQL_USER: ${DO_TOGETHER_DB_USERNAME}
      MYSQL_PASSWORD: ${DO_TOGETHER_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: do-together-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: do-together-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${DO_TOGETHER_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${DO_TOGETHER_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${DO_TOGETHER_RABBITMQ_VIRTUAL_HOST:-/}
    ports:
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: do-together-backend
    environment:
      DO_TOGETHER_DB_URL: jdbc:mysql://mysql:3306/do_together?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      DO_TOGETHER_DB_USERNAME: ${DO_TOGETHER_DB_USERNAME}
      DO_TOGETHER_DB_PASSWORD: ${DO_TOGETHER_DB_PASSWORD}
      DO_TOGETHER_REDIS_HOST: redis
      DO_TOGETHER_REDIS_PORT: 6379
      DO_TOGETHER_REDIS_PASSWORD: ""
      DO_TOGETHER_RABBITMQ_HOST: rabbitmq
      DO_TOGETHER_RABBITMQ_PORT: 5672
      DO_TOGETHER_RABBITMQ_USERNAME: ${DO_TOGETHER_RABBITMQ_USERNAME}
      DO_TOGETHER_RABBITMQ_PASSWORD: ${DO_TOGETHER_RABBITMQ_PASSWORD}
      DO_TOGETHER_RABBITMQ_VIRTUAL_HOST: ${DO_TOGETHER_RABBITMQ_VIRTUAL_HOST:-/}
      DO_TOGETHER_JWT_SECRET: ${DO_TOGETHER_JWT_SECRET:-dev-secret-do-not-use-in-production-please-change-48chars-minimum}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_URL: ""
    container_name: do-together-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
